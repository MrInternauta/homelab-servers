# Portainer + tsdproxy labels — same stack as docker-compose.yaml, but tagged
# for a Tailscale proxy sidecar (the sidecar itself is not in this repo).
#
#   docker compose -f portainer/compose-with-tsdproxy.yaml up -d
services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - 9000:9000
    environment:
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      tsdproxy.enable: true
      tsdproxy.ephemeral: false

volumes:
  portainer_data:
