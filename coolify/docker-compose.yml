# Coolify — self-hosted PaaS. http://localhost:8000
#
# Four containers: the UI (php-fpm), Postgres 15, Redis 7, and soketi (realtime).
# The UI waits on all three healthchecks, so it stays in `Created` for a minute
# or two on first boot. That is normal.
#
# PLATFORM NOTE: Coolify is designed to manage the LINUX host it runs on, over
# SSH to localhost. On macOS it starts and the UI works, but it cannot deploy to
# the Mac itself — treat it as a Linux-host feature. See REQUIREMENTS.md.
#
# Settings come from this directory's `.env` (generated by ../configure.sh).
# COOLIFY_STORAGE is where all persistent state lives; on Linux prefer a local
# disk (e.g. /data/coolify) over a network share — Postgres on NFS/SMB is slow
# and corruption-prone.
services:
  coolify:
    image: "${REGISTRY_URL:-docker.io}/coollabsio/coolify:${LATEST_IMAGE:-latest}"
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${APP_PORT:-8000}:8080"
    expose:
      - "${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_FPM_PM_CONTROL=${PHP_FPM_PM_CONTROL:-dynamic}
      - PHP_FPM_PM_START_SERVERS=${PHP_FPM_PM_START_SERVERS:-1}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
    volumes:
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env — run ../configure.sh}/ssh:/var/www/html/storage/app/ssh
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/applications:/var/www/html/storage/app/applications
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/databases:/var/www/html/storage/app/databases
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/services:/var/www/html/storage/app/services
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/backups:/var/www/html/storage/app/backups
      # ── Linux only ────────────────────────────────────────────────────────
      # Let Coolify drive this host's Docker daemon and deploy to it. Pointless
      # on macOS, where the daemon lives in a VM Coolify cannot SSH into.
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      soketi:
        condition: service_healthy
    networks:
      - coolify

  postgres:
    image: postgres:15-alpine
    container_name: coolify-db
    restart: always
    environment:
      POSTGRES_USER: "${DB_USERNAME:-coolify}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env — run ../configure.sh}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    volumes:
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USERNAME:-coolify} -d ${DB_DATABASE:-coolify} || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    container_name: coolify-redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/redis:/data
    healthcheck:
      test: redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

  soketi:
    image: "${REGISTRY_URL:-docker.io}/coollabsio/coolify-realtime:1.0.16"
    container_name: coolify-realtime
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${SOKETI_PORT:-6001}:6001"
      - 6002:6002
    volumes:
      - ${COOLIFY_STORAGE:?set COOLIFY_STORAGE in .env}/ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: "${APP_NAME:-Coolify}"
      SOKETI_DEBUG: "${SOKETI_DEBUG:-false}"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:?set PUSHER_APP_ID in .env}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:?set PUSHER_APP_KEY in .env}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:?set PUSHER_APP_SECRET in .env}"
      SOKETI_HOST: "${SOKETI_HOST:-0.0.0.0}"
    healthcheck:
      test: wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    driver: bridge
