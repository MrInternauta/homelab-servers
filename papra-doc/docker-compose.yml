# Papra — document management. http://localhost:1221
#
# Settings come from this directory's `.env` (generated by ../configure.sh),
# so the same file works on macOS and Linux.
services:
  papra:
    container_name: papra
    image: ghcr.io/papra-hq/papra:latest
    restart: unless-stopped
    ports:
      - 1221:1221
    env_file:
      # Supplies AUTH_SECRET to the container.
      - .env
    environment:
      - TZ=${TZ:-America/Mexico_City}
      - PAPRA_DATA_FOLDER=/app/app-data
    volumes:
      # SQLite DB and stored documents are split: the DB on a local disk, the
      # documents on the backup volume. Fixed Linux host paths.
      - /opt/papra/db:/app/app-data/db
      - /mnt/backup/Documents/documents:/app/app-data/documents
    # Papra runs as this uid:gid, so the files it writes belong to you.
    # macOS: 501/20 — Linux: usually 1000/1000.
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
