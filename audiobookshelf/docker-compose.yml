# Audiobookshelf — audiobook & podcast server. http://localhost:13378
#
# Paths come from this directory's `.env` (generated by ../configure.sh), so the
# same file works on macOS and Linux. `${VAR:?...}` makes compose fail loudly
# instead of silently mounting an empty directory.
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    # ABS listens on port 80 inside the container. To change the published
    # port, only change the number on the left.
    ports:
      - 13378:80
    environment:
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      # Persistent library state, kept next to this compose file.
      - ./config:/config
      - ./metadata:/metadata
      # Host path on the left, container path on the right. Add more mounts
      # here for additional libraries.
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env — run ./configure.sh}/Audio:/audiobooks
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}/Documents:/books
      - ${EXTERNAL_STORAGE:?set EXTERNAL_STORAGE in .env — run ./configure.sh}/Audio:/audiobooks-external
      - ${EXTERNAL_STORAGE:?set EXTERNAL_STORAGE in .env}/Documents:/books-external
    restart: unless-stopped
    # Audiobookshelf ignores PUID/PGID; it takes a plain user directive instead.
    # On Linux this keeps written files owned by you rather than by root.
    user: "${PUID:-501}:${PGID:-20}"
