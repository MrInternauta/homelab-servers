# Obsidian — full Obsidian GUI in the browser (KasmVNC).
# http://localhost:3000  /  https://localhost:3001
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    security_opt:
      # Chromium-based apps need this to run inside Docker.
      - seccomp:unconfined
    environment:
      # Taken from the shared host settings, so vault files stay editable from
      # the host on both macOS (501/20) and Linux (usually 1000/1000).
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      # Obsidian configuration and your vaults.
      - ./obsidian/config:/config
    ports:
      - 3000:3000 # HTTP web GUI
      - 3001:3001 # HTTPS web GUI
    # Prevents Chromium from crashing on a tiny default /dev/shm.
    shm_size: 1gb
    restart: unless-stopped
