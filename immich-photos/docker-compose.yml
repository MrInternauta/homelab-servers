# Immich — photo library. http://localhost:2283
#
# Four containers: server, machine learning, valkey (redis), postgres.
# Settings come from this directory's `.env` (generated by ../configure.sh),
# so the same file works on macOS and Linux.
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${EXTERNAL_STORAGE:?set EXTERNAL_STORAGE in .env — run ./configure.sh}/Images:/mnt/external-data
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env — run ./configure.sh}/Images:/mnt/external-library:ro
    env_file:
      - .env
    environment:
      DB_HOSTNAME: immich-db
      DB_PORT: 5432
      REDIS_HOSTNAME: immich-redis
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - 2283:2283
    depends_on:
      - immich-redis
      - immich-db
    restart: always

  immich-machine-learning:
    container_name: immich_ml
    # Linux with an NVIDIA GPU: append `-cuda` to the tag and uncomment the
    # `deploy` block below for a large speed-up on imports. Docker Desktop on
    # macOS has no GPU passthrough, so it always runs CPU-only there.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ./ml-cache:/cache
    env_file:
      - .env
    environment:
      TRANSFORMERS_CACHE: /cache
      MACHINE_LEARNING_WORKERS: 1
    restart: always
    # ── Linux only: NVIDIA acceleration (needs the NVIDIA Container Toolkit) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    restart: always

  immich-db:
    container_name: immich_db
    # Immich's own pinned Postgres image — do not swap it for stock postgres.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env — run ./configure.sh}
      POSTGRES_USER: ${DB_USERNAME:-immich}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
    volumes:
      # Repo-local on purpose: the database is small, and a NAS round-trip
      # would make Postgres crawl.
      - ./db-data:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
