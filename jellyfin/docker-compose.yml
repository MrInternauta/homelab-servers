# Jellyfin — media server. http://localhost:8096
#
# Paths and IDs come from this directory's `.env` (generated by ../configure.sh),
# so the same file works on macOS and Linux.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/Mexico_City}
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env — run ./configure.sh}/Videos:/data/videos
      - ${EXTERNAL_STORAGE:?set EXTERNAL_STORAGE in .env — run ./configure.sh}/Videos:/data/videos-external
    ports:
      - 8096:8096
      # - "8920:8920"   # Optional: HTTPS
    restart: unless-stopped

    # ── Linux only: hardware transcoding ─────────────────────────────────────
    # Docker Desktop on macOS cannot pass a GPU through, so transcoding there is
    # CPU-only. On a Linux host you can hand the container the render node and
    # get VAAPI/QSV/NVDEC acceleration. Uncomment the block below, then enable
    # the matching option in Jellyfin → Dashboard → Playback → Transcoding.
    #
    # Intel / AMD (VAAPI or QSV) — check `ls -l /dev/dri` for the render group:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:-989}"   # gid of the `render` group: getent group render
    #
    # NVIDIA (needs the NVIDIA Container Toolkit installed on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
