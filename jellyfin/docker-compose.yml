services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Mexico_City
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /Users/<ROOT_USERNAME>/Videos:/data/videos
      - /Volumes/<EXTERNAL_STORAGE>/Videos:/data/videos-external
    ports:
      - 8096:8096
#     - 8920:8920 # Optional: Secure HTTPS port
    restart: unless-stopped